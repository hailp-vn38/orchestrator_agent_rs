# Host YAML DTO example, NOT core Rust AgentDefinition serde or OpenCode config.
# Host converts agents.<key> to AgentDefinition.id, and
# prompt/provider/model/tools/skills to prompt_path/provider_id/model_id/allowed_tools/allowed_skills.
# Provider aliases must exist in typed host-injected LlmConfig.providers.
# Mandatory base prompt is embedded in library, no prompts/base.md file needed.
runtime:
  max_subagent_depth: 1
  max_concurrent_children: 1       # foreground MVP; no cap on sequential delegations
  llm_request_timeout_s: 120       # per LLM request, not entire agent/session
  max_tool_output_bytes: 51200
  max_tool_output_lines: 2000
  compaction:
    auto: true
    keep_recent_tokens: 15000
    reserve_output_tokens: 16000   # example; clamp to model capabilities
  recovery:
    max_attempts_per_turn: 10
  events:
    broadcast_capacity: 4096    # live only; lagged receiver must resync
    heartbeat_s: 15             # per SSE connection, outside broadcast
    active_snapshot_refresh_s: 30  # host fallback when terminal notification lost
    # text coalescing and hard event payload cap are internal MVP constants,
    # with strict redaction; configure only after benchmarks require it.
  # No child_timeout_s and no default max_steps.

agents:
  root:
    mode: primary
    description: Root orchestrator
    prompt: prompts/root.md
    provider: openai
    model: gpt-4.1-mini
    # steps: 20  # OPTIONAL. Unset = no step cap.
    tools: [subagent, skill, read_file, search_code]
    skills: [task-planning]

  explorer:
    mode: subagent
    description: Explore codebase and report findings
    prompt: prompts/explorer.md
    provider: google
    model: gemini-2.5-flash
    tools: [skill, read_file, search_code]
    skills: [rust-review]

  reviewer:
    mode: subagent
    description: Review code correctness
    prompt: prompts/reviewer.md
    provider: anthropic
    model: claude-sonnet-4-20250514
    tools: [skill, read_file, search_code]
    skills: [rust-review]

# Provider/model IDs are illustrative; host converts aliases to typed LlmConfig.
# Builder validates local config; tool capability/reachability verified on request/smoke.
