[package]
name = "orchestrator_agent_rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Embeddable multi-agent orchestrator library (v5.0 design)"
publish = false
build = "build.rs"

# Spike G0 là package độc lập (có [workspace] riêng), không thuộc library.
exclude = ["spikes/", "docs/"]

[features]
# Seam test nội bộ (fake LlmGateway + fault hooks). Không bật trong build production;
# integration tests bật qua self dev-dependency bên dưới.
test-support = []

[dependencies]
async-trait = "0.1"
futures = "0.3"
# Pin chính xác theo evidence G0 (AT-48); không copy type của `llm` ra public API.
llm = { version = "=1.3.8", default-features = false, features = ["openai", "anthropic", "google", "ollama", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# Không tạo runtime: chỉ dùng tokio của runtime do host sở hữu (EMB-04).
tokio = { version = "1", default-features = false, features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
orchestrator_agent_rs = { path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "test-util"] }
tempfile = "3"
