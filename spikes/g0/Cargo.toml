[package]
name = "g0-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
llm = { version = "=1.3.8", default-features = false, features = ["openai", "anthropic", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
tempfile = "3"
sha2 = "0.10"
